[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finprm"
version = "0.1.0"
description = "Process reward model adaptation for FinQA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
ml = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "peft>=0.13",
  "scikit-learn>=1.4",
  "transformers>=4.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

