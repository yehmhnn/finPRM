# First command to run on a CUDA server. This is not a research experiment.
runtime:
  device: cuda
  seed: 42
data:
  input: data/processed/pilot-hard-v2/examples.jsonl
  evidence_mode: gold
  max_examples: 100
  eval_fraction: 0.2
model:
  checkpoint: hf-internal-testing/tiny-random-bert
  revision: main
  max_length: 256
training:
  batch_size: 8
  gradient_accumulation_steps: 1
  epochs: 1
  learning_rate: 0.00005
  mixed_precision: "no"
  quantization: false
output:
  directory: runs/cuda-pipeline-smoke
