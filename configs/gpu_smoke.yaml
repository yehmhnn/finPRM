# Run this before any full GPU experiment.
runtime:
  device: cuda
  seed: 42
data:
  input: data/processed/pilot-hard-v2/examples.jsonl
  evidence_mode: gold
  max_examples: 500
  eval_fraction: 0.2
model:
  checkpoint: TO_BE_FROZEN
  revision: TO_BE_FROZEN
  max_length: 512
training:
  batch_size: 1
  gradient_accumulation_steps: 8
  epochs: 1
  learning_rate: 0.00005
  mixed_precision: bf16
  quantization: false
output:
  directory: runs/gpu-smoke
